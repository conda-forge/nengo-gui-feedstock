{% set name = "nengo-gui" %}
{% set version = "0.6.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: c5be73fed157e0446ed271799d2fe1faf98a82853cd2a4f40d7b948ec305ea2e
  patches:
    - fix-python-3-8-and-higher.patch

build:
  number: 0
  noarch: python
  entry_points:
    - nengo_gui = nengo_gui:old_main
    - nengo = nengo_gui:main
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - setuptools
    - python {{ python_min }}
  run:
    - nengo >=2.6.0
    - python >={{ python_min }},<3.11
    - jedi >=0.16.0

test:
  imports:
    - nengo_gui
    - nengo_gui._vendor
  commands:
    - pip check
    - nengo_gui --help
    - nengo --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/nengo/nengo-gui
  summary: Web-based GUI for building and visualizing Nengo models.
  license: LicenseRef-NENGO
  license_file: LICENSE.rst

extra:
  recipe-maintainers:
    - Tobias-Fischer
